# Swoopy Pro key server. Secrets are NOT in this file: they are stored on Cloudflare with
# "npx wrangler secret put NAME" (see README.md): KEY_SECRET, SIGNING_KEY.
name = "swoopy-pro"
main = "src/index.js"
compatibility_date = "2026-06-01"
account_id = "ac884c4c755abc4f7ddc614c173baeca"  # the owner's Cloudflare account (not a secret)
workers_dev = true

# Which keys were used, and by which Mac (migrations/).
[[d1_databases]]
binding = "DB"
database_name = "swoopy-pro"
database_id = "465d65fb-3edb-4d71-9fdb-c89fa3a2f68e"
migrations_dir = "migrations"

# At most 10 tries a minute from one internet address (no extra cost).
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "7301"
simple = { limit = 10, period = 60 }
